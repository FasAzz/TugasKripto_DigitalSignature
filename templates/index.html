<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signature PDF</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-8 border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-slate-800">Digital Signature PDF</h1>
            <p class="text-slate-500 text-sm mt-1">Sistem Penandatanganan Dokumen Resmi dengan RSA-2048 & QR Code</p>
        </div>

        <!-- Form Sign Document -->
        <form id="signForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Penandatangan</label>
                <input type="text" id="signerName" required placeholder="Masukkan nama penandatangan..."
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Upload Berkas PDF</label>
                <input type="file" id="pdfFile" accept="application/pdf" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition cursor-pointer">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200">
                Proses & Sign Dokumen
            </button>
        </form>

        <!-- Result Section -->
        <div id="result" class="hidden mt-6 p-5 rounded-xl bg-green-50 border border-green-200 text-center">
            <div class="flex items-center justify-center space-x-2 text-green-700 font-semibold text-lg mb-2">
                <span>✅</span>
                <span id="resultMessage">Dokumen Berhasil Ditandatangani!</span>
            </div>
            <p class="text-slate-600 text-sm mb-4">QR Code berisi metadata signature telah berhasil ditempelkan ke berkas PDF.</p>
            <a id="downloadBtn" href="#" target="_blank"
                class="inline-block bg-green-600 hover:bg-green-700 text-white font-medium px-6 py-2.5 rounded-lg shadow transition">
                📥 Download Signed PDF
            </a>
        </div>
    </div>

    <script>
        document.getElementById('signForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const signerName = document.getElementById('signerName').value;
            const pdfFile = document.getElementById('pdfFile').files[0];
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');

            if (!pdfFile) return;

            // Indikator Loading
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses & Menandatangani...";

            const formData = new FormData();
            formData.append('signer_name', signerName);
            formData.append('file', pdfFile);

            try {
                // Request ke REST API Flask Fasha
                const response = await fetch('/api/sign', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('resultMessage').innerText = data.message;
                    document.getElementById('downloadBtn').href = data.signed_pdf_url;
                    resultDiv.classList.remove('hidden');
                } else {
                    alert("Gagal: " + (data.error || "Terjadi kesalahan saat memproses file."));
                }
            } catch (err) {
                alert("Kesalahan Jaringan: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Proses & Sign Dokumen";
            }
        });
    </script>
</body>
</html>
